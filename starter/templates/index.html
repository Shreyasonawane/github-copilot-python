<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty-selector">Difficulty:</label>
    <select id="difficulty-selector">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <button id="highlight-twos">Highlight 2s</button>
    <button id="theme-toggle">Dark Mode</button>
    <span id="message"></span>
    <span id="hint-counter">Hints used: 0</span>
    <span id="timer">Time: 00:00</span>
  </div>
  <div class="scoreboard">
    <h2>Top 10 Scores</h2>
    <div class="scoreboard-controls">
      <input id="player-name" type="text" maxlength="20" placeholder="Your name" />
      <button id="save-score">Save Score</button>
    </div>
    <ol id="score-list"></ol>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
